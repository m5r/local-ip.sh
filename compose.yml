services:
    local-ip.sh:
        image: local-ip.sh
        build: .
        volumes:
            - ./zones/local-ip.sh.zone:/etc/local-ip.zone:ro
            - state:/local-ip/state
        restart: unless-stopped
        environment:
            XIP_DOMAIN: "local-ip.sh"
            XIP_EMAIL: "admin@local-ip.sh"
            XIP_ZONE_FILE: "/etc/local-ip.zone"
            # XIP_ACME_DIRECTORY: "https://acme-staging-v02.api.letsencrypt.org/directory"
        ports:
            - 53:53/udp
            - 53:53/tcp
            - 80:80/tcp
            - 443:443/tcp

volumes:
    state:
