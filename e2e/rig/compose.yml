# The rig of "make e2e-local": the server built from this checkout, and Pebble as its certificate authority. TestRig owns the project: it removes it with its volumes before and after every run.
# The test reaches both containers at their addresses on the network below, so nothing is published on host ports, and the rig needs a Docker Engine running natively on the Linux host.
name: local-ip-e2e

services:
    pebble:
        image: ghcr.io/letsencrypt/pebble:2.10.3@sha256:0c81f05db371f436c97fb894bd6d2ab8fc9c8e2ce40f8bef8a8e15941bcd75ef
        # Challenges are validated against the server's own DNS answers.
        command: -config test/config/pebble-config.json -strict -dnsserver 10.253.53.53:53
        environment:
            PEBBLE_VA_NOSLEEP: "1"
            # A renewal must validate its challenges again instead of reusing the authorizations of the first issuance.
            PEBBLE_AUTHZREUSE: "0"
        networks:
            rig:
                ipv4_address: 10.253.53.10

    server:
        build: ../..
        environment:
            XIP_DOMAIN: local-ip.test
            XIP_EMAIL: admin@local-ip.test
            XIP_NAMESERVERS: 10.253.53.53
            XIP_ZONE_FILE: /etc/local-ip.zone
            XIP_ACME_DIRECTORY: https://pebble:14000/dir
            # Pebble picks one of its profiles at random for an order that names none.
            XIP_ACME_PROFILE: default
            SSL_CERT_FILE: /etc/pebble.minica.pem
        volumes:
            - ./zone:/etc/local-ip.zone:ro
            # pebble.minica.pem is test/certs/pebble.minica.pem of the Pebble release above: the root of the certificate Pebble's API serves. It is a public test certificate whose private key is published with Pebble, so nothing outside the rig may trust it.
            - ./pebble.minica.pem:/etc/pebble.minica.pem:ro
            - state:/local-ip/state
        networks:
            rig:
                ipv4_address: 10.253.53.53

networks:
    rig:
        ipam:
            config:
                # A private range unlikely to be in use on a developer machine.
                - subnet: 10.253.53.0/24

volumes:
    state:
