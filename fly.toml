app = "local-ip"
primary_region = "ams"
kill_signal = "SIGINT"
kill_timeout = "5s"

[build]

[env]
XIP_DOMAIN = "local-ip.sh"
XIP_EMAIL = "admin@local-ip.sh"
XIP_ZONE_FILE = "/etc/local-ip.zone"
XIP_NAMESERVERS = "137.66.40.11,137.66.40.12" # fly.io edge-only ip addresses, see https://community.fly.io/t/custom-domains-certificate-is-stuck-on-awaiting-configuration/8329

[mounts]
# The volume keeps the name it was created with, when lego managed the certificates.
source = "lego"
destination = "/local-ip/state"

[[files]]
guest_path = "/etc/local-ip.zone"
local_path = "zones/local-ip.sh.zone"

[[services]]
protocol = "udp"
internal_port = 53
auto_stop_machines = false
auto_start_machines = true
min_machines_running = 0

[[services.ports]]
port = 53

# DNS over TCP, for the replies that do not fit in UDP. Fly delivers TCP to a socket on any interface, unlike UDP.
[[services]]
protocol = "tcp"
internal_port = 53
auto_stop_machines = false
auto_start_machines = true
min_machines_running = 0

[[services.ports]]
port = 53

# Each TCP service has a check, so that a deploy waits for the listeners and `fly status` shows their state. A check shows that a TCP connection to the port completes, not that DNS, HTTP or TLS answer on it, and says nothing about UDP. A failing check restarts nothing: it takes the machine out of routing for that service until the check passes again. A deploy that fails on a check is not rolled back either: the machine stays on the new release, and going back is a deploy of the previous image.
[[services.tcp_checks]]
grace_period = "10s"
interval = "15s"
timeout = "2s"

[[services]]
protocol = "tcp"
internal_port = 80

[[services.ports]]
port = 80

[[services.tcp_checks]]
grace_period = "10s"
interval = "15s"
timeout = "2s"

[[services]]
protocol = "tcp"
internal_port = 443

[[services.ports]]
port = 443

[[services.tcp_checks]]
grace_period = "10s"
interval = "15s"
timeout = "2s"

# The smallest size, and the only one the account's free machine allowance covers. It may use
# 6.25% of a vCPU on average; on 2026-11-22 the service needed about 5% at about 110 queries per
# second, measured on a larger size. A burst of queries above that draws on the machine's burst
# balance, and once the balance is empty the machine is throttled and DNS answers get slow or lost
# until the burst ends: fly_instance_cpu_throttle and fly_instance_cpu_balance in Fly's metrics
# show it. Memory is not the limit: the server process holds under 20 MB.
[[vm]]
size = "shared-cpu-1x"
cpu_kind = "shared"
cpus = 1
memory_mb = 256
