app = "local-ip"
primary_region = "ams"
kill_signal = "SIGINT"
kill_timeout = "5s"

[experimental]
auto_rollback = true

[build]

[env]
XIP_DOMAIN = "local-ip.sh"
XIP_EMAIL = "admin@local-ip.sh"
XIP_NAMESERVERS = "137.66.40.11,137.66.40.12" # fly.io edge-only ip addresses, see https://community.fly.io/t/custom-domains-certificate-is-stuck-on-awaiting-configuration/8329

[mounts]
source = "lego"
destination = "/local-ip/.lego"

[[services]]
protocol = "udp"
internal_port = 53
auto_stop_machines = false
auto_start_machines = true
min_machines_running = 0

[[services.ports]]
port = 53

[[services]]
protocol = "tcp"
internal_port = 80

[[services.ports]]
port = 80

[[services]]
protocol = "tcp"
internal_port = 443

[[services.ports]]
port = 443

# [[services.http_checks]]
# interval = 10000
# grace_period = "30s"
# method = "get"
# path = "/"
# protocol = "https"
# timeout = 15000
# tls_skip_verify = false
# tls_server_name = "local-ip.sh"
# [services.http_checks.headers]

# One size above the usual shared-cpu-1x / 256 MB: on 2026-11-20 the service needed about 8% of a
# vCPU against that size's 6.25% allowance and was throttled into slow and lost DNS answers.
# Go back down once the CPU cost per query has been fixed and verified here.
[[vm]]
size = "shared-cpu-2x"
cpu_kind = "shared"
cpus = 2
memory_mb = 512
