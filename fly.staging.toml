app = "local-ip-staging"
primary_region = "ams"
kill_signal = "SIGINT"
kill_timeout = "5s"

[experimental]
auto_rollback = true

[build]

[env]
XIP_DOMAIN = "staging.local-ip.sh"
XIP_EMAIL = "admin@local-ip.sh"
XIP_ZONE_FILE = "/etc/local-ip.zone"
XIP_NAMESERVERS = "149.248.203.129"
XIP_STAGING = "true"

[mounts]
source = "lego"
destination = "/local-ip/.lego"

[[files]]
guest_path = "/etc/local-ip.zone"
local_path = "zones/staging.local-ip.sh.zone"

[[services]]
protocol = "udp"
internal_port = 53
auto_stop_machines = false
auto_start_machines = true
min_machines_running = 0

[[services.ports]]
port = 53

[[services]]
protocol = "tcp"
internal_port = 80

[[services.ports]]
port = 80

[[services]]
protocol = "tcp"
internal_port = 443

[[services.ports]]
port = 443

[[vm]]
size = "shared-cpu-1x"
cpu_kind = "shared"
cpus = 1
memory_mb = 256
