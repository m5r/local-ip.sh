app = "local-ip-staging"
primary_region = "ams"
kill_signal = "SIGINT"
kill_timeout = "5s"

[experimental]
auto_rollback = true

[build]

[env]
XIP_DOMAIN = "xip-staging.local-ip.sh"
XIP_EMAIL = "admin@local-ip.sh"
XIP_ZONE_FILE = "/etc/local-ip.zone"
XIP_NAMESERVERS = "149.248.203.129"
XIP_STAGING = "true"
# 160-hour certificates: this instance renews by itself about every three days, which keeps exercising unattended renewal against a real certificate authority.
XIP_ACME_PROFILE = "shortlived"

[mounts]
# The volume keeps the name it was created with, when lego managed the certificates.
source = "lego"
destination = "/local-ip/state"

[[files]]
guest_path = "/etc/local-ip.zone"
local_path = "zones/xip-staging.local-ip.sh.zone"

[[services]]
protocol = "udp"
internal_port = 53
auto_stop_machines = false
auto_start_machines = true
min_machines_running = 0

[[services.ports]]
port = 53

# DNS over TCP, for the replies that do not fit in UDP. Fly delivers TCP to a socket on any interface, unlike UDP.
[[services]]
protocol = "tcp"
internal_port = 53
auto_stop_machines = false
auto_start_machines = true
min_machines_running = 0

[[services.ports]]
port = 53

# Each TCP service has a check, so that a deploy waits for the listeners and `fly status` shows their state. A check shows that a TCP connection to the port completes, not that DNS, HTTP or TLS answer on it, and says nothing about UDP. A failing check restarts nothing: it takes the machine out of routing for that service until the check passes again.
[[services.tcp_checks]]
grace_period = "10s"
interval = "15s"
timeout = "2s"

[[services]]
protocol = "tcp"
internal_port = 80

[[services.ports]]
port = 80

[[services.tcp_checks]]
grace_period = "10s"
interval = "15s"
timeout = "2s"

[[services]]
protocol = "tcp"
internal_port = 443

[[services.ports]]
port = 443

[[services.tcp_checks]]
grace_period = "10s"
interval = "15s"
timeout = "2s"

[[vm]]
size = "shared-cpu-1x"
cpu_kind = "shared"
cpus = 1
memory_mb = 256
